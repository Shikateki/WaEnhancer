name: Build WhatsApp

on:
  workflow_dispatch:

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml
            **/gradle.properties

      - name: Write key
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
        run: |
          if [ ! -z "$KEY_STORE" ]; then
          echo androidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
          echo androidKeyAlias='${{ secrets.ALIAS }}' >> gradle.properties
          echo androidKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
          echo androidStoreFile='key.jks' >> gradle.properties
          echo "$KEY_STORE" | base64 --decode > key.jks
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fix legacy WppCore compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/wmods/wppenhacer/xposed/core/WppCore.kt')
          s = p.read_text()
          replacements = {
              'getPrivPrefs().edit(commit = true) { putString(key, value) }': 'getPrivPrefs().edit().putString(key, value).commit()',
              'getPrivPrefs().edit(commit = true) { putString(key, value.toString()) }': 'getPrivPrefs().edit().putString(key, value.toString()).commit()',
              'prefs.edit(commit = true) { remove(s) }': 'prefs.edit().remove(s).commit()',
              'getPrivPrefs().edit(commit = true) { putBoolean(key, value) }': 'getPrivPrefs().edit().putBoolean(key, value).commit()',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Build WhatsApp Release
        run: ./gradlew assembleWhatsappDebug -Pminify=true

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: WaEnhancer
          path: app/build/outputs/apk/whatsapp/debug/WaEnhancer*.apk
