name: Build WhatsApp

on:
  workflow_dispatch:

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml
            **/gradle.properties

      - name: Write key
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
        run: |
          if [ ! -z "$KEY_STORE" ]; then
          echo androidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
          echo androidKeyAlias='${{ secrets.ALIAS }}' >> gradle.properties
          echo androidKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
          echo androidStoreFile='key.jks' >> gradle.properties
          echo "$KEY_STORE" | base64 --decode > key.jks
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inspect DexKit native library
        run: |
          echo '=== DexKit AAR contents ==='
          unzip -l app/libs/dexkit-android.aar | grep -E 'jni/|libdexkit.so' || true
          echo '=== ABI directories in AAR ==='
          unzip -Z1 app/libs/dexkit-android.aar | grep -E '^jni/[^/]+/libdexkit\.so$' || true

      - name: Fix DexKit EdXposed native loading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/wmods/wppenhacer/xposed/core/devkit/Unobfuscator.kt')
          s = p.read_text()

          old_import = 'import java.lang.reflect.Modifier\n'
          new_import = '''import java.lang.reflect.Modifier
          import java.io.File
          import java.io.FileOutputStream
          import java.net.URLDecoder
          import java.util.zip.ZipFile
          import android.os.Build
          '''
          if 'import java.util.zip.ZipFile' not in s:
              s = s.replace(old_import, new_import, 1)

          old = '''    init {
              System.loadLibrary("dexkit")
          }

          @JvmStatic
          fun initWithPath(path: String): Boolean {
              return try {
                  bridge = DexKitBridge.create(path)
                  true
              } catch (_: Exception) {
                  false
              }
          }'''

          new = '''    private fun loadDexKitForEdXposed() {
              try {
                  System.loadLibrary("dexkit")
                  XposedBridge.log("[DexKit] System.loadLibrary succeeded")
                  return
              } catch (e: Throwable) {
                  XposedBridge.log("[DexKit] System.loadLibrary failed: ${e.message}")
              }

              val moduleApk = try {
                  val location = Unobfuscator::class.java.protectionDomain?.codeSource?.location
                  if (location == null) null else File(URLDecoder.decode(location.path, "UTF-8"))
              } catch (e: Throwable) {
                  XposedBridge.log("[DexKit] Cannot resolve module APK: ${e.message}")
                  null
              }

              if (moduleApk == null || !moduleApk.isFile) {
                  throw UnsatisfiedLinkError("DexKit module APK not found: $moduleApk")
              }

              val abi = Build.SUPPORTED_ABIS.firstOrNull { candidate ->
                  ZipFile(moduleApk).use { zip ->
                      zip.getEntry("lib/$candidate/libdexkit.so") != null
                  }
              } ?: throw UnsatisfiedLinkError("No DexKit ABI for ${Build.SUPPORTED_ABIS.contentToString()}")

              val entryName = "lib/$abi/libdexkit.so"
              val fileName = "libdexkit_${abi}.so"
              val roots = arrayOf(
                  File("/data/user/0/com.whatsapp/cache/waenhancer"),
                  File("/data/data/com.whatsapp/cache/waenhancer"),
                  File("/data/user/0/com.whatsapp/files/waenhancer"),
                  File("/data/data/com.whatsapp/files/waenhancer"),
                  File("/data/user/0/com.whatsapp/cache"),
                  File("/data/data/com.whatsapp/cache")
              )

              var lastError: Throwable? = null
              for (root in roots) {
                  try {
                      if (!root.exists() && !root.mkdirs()) continue
                      val out = File(root, fileName)
                      ZipFile(moduleApk).use { zip ->
                          val entry = zip.getEntry(entryName)
                              ?: throw UnsatisfiedLinkError("Missing $entryName in module APK")
                          zip.getInputStream(entry).use { input ->
                              FileOutputStream(out).use { output -> input.copyTo(output) }
                          }
                      }
                      System.load(out.absolutePath)
                      XposedBridge.log("[DexKit] Loaded $entryName from ${out.absolutePath}")
                      return
                  } catch (e: Throwable) {
                      lastError = e
                  }
              }
              throw UnsatisfiedLinkError("Could not load DexKit $entryName: ${lastError?.message}")
          }

          @JvmStatic
          fun initWithPath(path: String): Boolean {
              return try {
                  loadDexKitForEdXposed()
                  bridge = DexKitBridge.create(path)
                  true
              } catch (e: Throwable) {
                  XposedBridge.log("[DexKit] init failed: ${e.message}")
                  false
              }
          }'''

          if old not in s:
              raise SystemExit('Expected Unobfuscator DexKit block not found')
          p.write_text(s.replace(old, new, 1))
          print('DexKit EdXposed loader patched')
          PY

      - name: Fix legacy WppCore compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/wmods/wppenhacer/xposed/core/WppCore.kt')
          s = p.read_text()

          marker = 'package com.wmods.wppenhacer.xposed.core\n'
          imports = '''\nimport com.wmods.wppenhacer.R\nimport com.wmods.wppenhacer.views.dialog.BottomDialogWpp\nimport com.wmods.wppenhacer.xposed.bridge.WaeIIFace\nimport com.wmods.wppenhacer.xposed.core.components.FMessageWpp\nimport com.wmods.wppenhacer.xposed.core.devkit.Unobfuscator\nimport com.wmods.wppenhacer.xposed.core.devkit.UnobfuscatorCache\nimport com.wmods.wppenhacer.xposed.utils.CDSharedPreferences\nimport com.wmods.wppenhacer.xposed.utils.ReflectionUtils\nimport com.wmods.wppenhacer.xposed.utils.Utils\nimport de.robv.android.xposed.XC_MethodHook\nimport de.robv.android.xposed.XposedBridge\nimport de.robv.android.xposed.XposedHelpers\nimport com.wmods.wppenhacer.xposed.core.components.FMessageWpp.UserJid\n'''
          if imports.strip() not in s:
              s = s.replace(marker, marker + imports, 1)

          replacements = {
              'getPrivPrefs().edit(commit = true) { putString(key, value) }': 'getPrivPrefs().edit().putString(key, value).commit()',
              'getPrivPrefs().edit(commit = true) { putString(key, value.toString()) }': 'getPrivPrefs().edit().putString(key, value.toString()).commit()',
              'prefs.edit(commit = true) { remove(s) }': 'prefs.edit().remove(s).commit()',
              'getPrivPrefs().edit(commit = true) { putBoolean(key, value) }': 'getPrivPrefs().edit().putBoolean(key, value).commit()',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Fix EdXposed WhatsApp status handshake
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/wmods/wppenhacer/xposed/core/FeatureLoader.kt')
          s = p.read_text()

          early = '''registerReceivers()\n\n                        try {'''
          replacement = '''registerReceivers()\n                        // Announce EdXposed hook presence before optional initialization can fail.\n                        sendEnabledBroadcast(application)\n\n                        try {'''
          if early in s:
              s = s.replace(early, replacement, 1)

          late = '''\n                            sendEnabledBroadcast(application)\n\n                            val totalTime ='''
          if late in s:
              s = s.replace(late, '''\n                            val totalTime =''', 1)
          p.write_text(s)
          PY

      - name: Fix EdXposed hook startup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/wmods/wppenhacer/WppXposed.kt')
          s = p.read_text()

          old = '''            if (lpparam.isFirstApplication) { // I believe this may fix the problem when using multiple accounts, not yet tested
                XposedBridge.log("[•] This package: ${lpparam.packageName}")
                FeatureLoader.start(classLoader, lpparam.appInfo.sourceDir)
                disableSecureFlag()
            }'''
          new = '''            // EdXposed compatibility: some legacy EdXposed builds do not reliably
            // expose isFirstApplication for WhatsApp. The hook must still be installed.
            XposedBridge.log("[•] This package: ${lpparam.packageName}, first=${lpparam.isFirstApplication}")
            FeatureLoader.start(classLoader, lpparam.appInfo.sourceDir)
            disableSecureFlag()'''
          if old in s:
              p.write_text(s.replace(old, new, 1))
              print("WppXposed startup block patched")
          else:
              print("WppXposed startup block already patched; skipping")
          PY

      - name: Build WhatsApp Release
        run: ./gradlew assembleWhatsappDebug -Pminify=true

      - name: Inspect built APK DexKit native library
        run: |
          echo '=== Built APK DexKit library ==='
          unzip -l app/build/outputs/apk/whatsapp/debug/WaEnhancer*.apk | grep -E 'lib/[^/]+/libdexkit\.so' || true
          echo '=== All native libraries in APK ==='
          unzip -Z1 app/build/outputs/apk/whatsapp/debug/WaEnhancer*.apk | grep '^lib/' || true

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: WaEnhancer
          path: app/build/outputs/apk/whatsapp/debug/WaEnhancer*.apk
